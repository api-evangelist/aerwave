aid: aerwave
name: Aerwave
description: 'Aerwave is a Dallas, Texas managed Wi-Fi provider founded in 2019 that
  builds and operates fiber-backed, property-wide wireless networks for multifamily
  apartment communities and student housing. Its HomeWiFi platform gives each resident
  a private, VLAN-isolated network with individual encryption and instant-on gigabit
  service without a rented router, while property owners and managers get a SaaS
  portal for network management, resident onboarding and support. Aerwave publishes
  no public developer program or API documentation; the machine-readable surface it
  does serve is an llms.txt and a live, anonymous Model Context Protocol endpoint on
  its marketing site, both provided by its Wix hosting platform.'
