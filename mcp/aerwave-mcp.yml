notes:
- >-
  The tools/list response is saved verbatim to mcp/aerwave-mcp-tools.json; every
  inputSchema in this manifest is copied from that response, not authored here.
- >-
  No OAuth challenge was returned. Both /.well-known/oauth-protected-resource and
  /.well-known/oauth-authorization-server return HTTP 400 with the Wix HTML shell
  on this host, so there is no published authorization-server metadata.
- >-
  No tool crosswalk is emitted, because Aerwave publishes no OpenAPI or GraphQL
  surface for these tools to bind to.
