name: Aerwave Site MCP
slug: aerwave
summary: >-
  Aerwave serves a live, anonymous Model Context Protocol endpoint at
  https://www.aerwave.com/_api/mcp. It is advertised in the company's own
  llms.txt at https://www.aerwave.com/llms.txt and answered a tools/list
  request with HTTP 200 and nine tools carrying full JSON Schema inputSchema
  blocks on 2026-09-12.
authorship: platform
authorship_note: >-
  This endpoint is provided by Wix, Aerwave's website hosting platform, not
  authored by Aerwave engineering. The tool set is the generic Wix Site MCP
  surface (site search, business details, Wix REST API passthrough) and is
  identical in shape across every Wix-hosted site. It is recorded because it
  is genuinely served from a host Aerwave controls and is genuinely reachable
  by an agent with no credentials - but it exposes the public marketing site,
  not the Aerwave managed-WiFi product. Aerwave publishes no first-party API.
deployment:
  mode: remote
  endpoint: https://www.aerwave.com/_api/mcp
  auth: none
  verified: probed
